function el(id){return document.getElementById(id)}function arr(v){return Array.isArray(v)?v:[]}
function norm(v){
 var text=String(v==null?'':v).toLowerCase()
  .replace(/[\u2010-\u2015\u2212\uFE63\uFF0D]/g,'-')
  .replace(/\s+/g,'')
  .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g,function(ch){return '^'+'⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(ch);})
  .replace(/,/g,'.').replace(/\*/g,'');
 // Vereinheitliche einen einzelnen Monom-Term mathematisch:
 // Koeffizientenbrüche kuerzen, 1 vor Variablen weglassen,
 // gleiche Variablen zusammenfassen und Faktoren alphabetisch ordnen.
 var m=text.match(/^([+-]?)(?:\((\d+)\/(\d+)\)|(\d+(?:\.\d+)?)(?:\/(\d+))?)?((?:[a-z](?:\^\d+)?)*)$/);
 if(m){
  var sign=m[1]==='-'?-1:1;
  var num=m[2]!==undefined?Number(m[2]):(m[4]!==undefined?Number(m[4]):1);
  var den=m[3]!==undefined?Number(m[3]):(m[5]!==undefined?Number(m[5]):1);
  if(den===1&&Number.isFinite(num)&&!Number.isInteger(num)){var decimal=String(Number(num.toFixed(8)));var decimalVars=(m[6]||'').replace(/\^1(?=[a-z]|$)/g,'');if(decimal==='1'&&decimalVars)return (sign<0?'-':'')+decimalVars;return (sign<0?'-':'')+decimal+decimalVars;}
  if(den>0&&Number.isSafeInteger(num)&&Number.isSafeInteger(den)){
   var g=function(a,b){while(b){var r=a%b;a=b;b=r;}return a||1;}(num,den);if(g!==1)return text; // Nicht gekuerzte Brueche werden bewusst nicht akzeptiert.
   num/=g;den/=g;
   var factors={},re=/([a-z])(?:\^(\d+))?/g,part;
   while((part=re.exec(m[6]))!==null){factors[part[1]]=(factors[part[1]]||0)+Number(part[2]||1);}
   var vars=Object.keys(factors).sort().map(function(key){return key+(factors[key]===1?'':'^'+factors[key]);}).join('');
   var coefficient='';
   if(vars){if(num!==den){coefficient=(num===1&&den===1?'':(den===1?String(num):num+'/'+den));}else{coefficient='';}}
   else{coefficient=den===1?String(num):num+'/'+den;}
   if(sign<0){if(coefficient==='')coefficient='-';else coefficient='-'+coefficient;}
   return coefficient+vars;
  }
 }
 // Fuer mehrgliedrige Terme: Schreibweisen vereinheitlichen,
 // ohne die Reihenfolge der Summanden eigenmaechtig zu veraendern.
 return text.replace(/(^|[+-])1(?=[a-z])/g,'$1');
}

function lesson(){var l=levels[current],t=l.tasks[taskIndex];if(!l||!t){overview();return}update();var frac=t.fraction?'<div class="math"><span class="fraction"><span class="num">'+t.fraction.num+'</span><span class="den">'+t.fraction.den+'</span></span></div>':'';var rule=l.rule.replace(/\n/g,'<br>');el('app').innerHTML='<div class="topnav"><button class="action secondary" id="back">← Übersicht</button><span class="small">Lernschritt '+(current+1)+' von 5 · Aufgabe '+(taskIndex+1)+' von '+l.tasks.length+'</span></div><section class="panel"><div class="tag">'+l.name+'</div><h2>'+l.name+'</h2><p>'+l.intro+'</p><div class="rule"><strong>Regel:</strong><br>'+rule+'</div></section><section class="question"><p class="math">'+t.q+'</p>'+frac+'<label for="answer"><strong>Deine Eingabe</strong></label><input class="answer" id="answer" type="text" autocomplete="off" placeholder="Ergebnis eingeben"><div class="keyboard"><strong>Tastatureingabe:</strong> Minus: <b>-</b> (deutsche Tastatur, neben dem Punkt) oder Minustaste am Ziffernblock. Potenzen: z. B. <b>x^2</b> oder <b>x²</b>. Multiplikation: <b>*</b> oder direkt nebeneinander, z. B. <b>3x</b>. Brüche bitte vollständig kürzen und als vereinfachten Term eingeben (z. B. 2/3x², nicht 4/6x²). Leerzeichen sind erlaubt.</div><div class="buttons"><button class="action" id="check">Antwort prüfen</button><button class="action secondary" id="hint">Hinweis erhalten</button><button class="action secondary" id="ruleBtn">Regel nochmals erklären</button></div><div class="hint" id="hintBox"></div><div class="feedback" id="feedback" role="status"></div></section>';

function hint(){var t=levels[current].tasks[taskIndex],h=el('hintBox');if(hintIndex>=t.hint.length)hintIndex=t.hint.length-1;h.textContent=t.hint[hintIndex];h.className='hint show';hintIndex++}
function check(){var t=levels[current].tasks[taskIndex],v=norm(el('answer').value),f=el('feedback');if(!v){f.textContent='Bitte gib zuerst eine Antwort ein.';f.className='feedback show bad';return}tries++;if(arr(t.ans).map(norm).indexOf(v)>=0){points+=3;areaPoints[levels[current].area]+=3;f.textContent='Richtig! '+t.why+' Du erhältst 3 Punkte.';f.className='feedback show good';update();el('answer').disabled=true;el('check').disabled=true;var n=document.createElement('button');n.className='action';n.textContent=taskIndex<levels[current].tasks.length-1?'Nächste Aufgabe':'Lernschritt abschliessen';n.addEventListener('click',next);el('app').querySelector('.buttons').appendChild(n)}else{points=Math.max(0,points-1);areaPoints[levels[current].area]=Math.max(0,areaPoints[levels[current].area]-1);update();f.textContent=tries===1?'Noch nicht richtig. Prüfe zuerst die Koeffizienten und Vorzeichen.':tries===2?'Nutze einen Hinweis und kontrolliere die Potenzregel.':'Versuche es noch einmal oder lasse dir nach drei Versuchen die Erklärung zeigen.';f.className='feedback show bad';if(tries>=3&&!el('showSolution')){var b=document.createElement('button');b.id='showSolution';b.className='action secondary';b.textContent='Erklärung anzeigen';b.addEventListener('click',function(){f.textContent='Lösung: '+t.why;f.className='feedback show';el('answer').disabled=true;el('check').disabled=true;var n=document.createElement('button');n.className='action';n.textContent=taskIndex<levels[current].tasks.length-1?'Nächste Aufgabe':'Lernschritt abschliessen';n.addEventListener('click',next);el('app').querySelector('.buttons').appendChild(n)});el('app').querySelector('.buttons').appendChild(b)}}}
