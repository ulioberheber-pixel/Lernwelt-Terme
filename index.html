function norm(v){
 var text=String(v==null?'':v).toLowerCase()
  .replace(/[\u2010-\u2015\u2212\uFE63\uFF0D]/g,'-')

 // Vereinheitliche einen einzelnen Monom-Term mathematisch:
 // Koeffizientenbrüche kuerzen, 1 vor Variablen weglassen,

 var m=text.match(/^([+-]?)(?:\((\d+)\/(\d+)\)|(\d+(?:\.\d+)?)(?:\/(\d+))?)?((?:[a-z](?:\^\d+)?)*)$/);
 if(m){
  var sign=m[1]==='-'?-1:1;
  var num=m[2]!==undefined?Number(m[2]):(m[4]!==undefined?Number(m[4]):1);
  var den=m[3]!==undefined?Number(m[3]):(m[5]!==undefined?Number(m[5]):1);
  if(den===1&&Number.isFinite(num)&&!Number.isInteger(num)){var decimal=String(Number(num.toFixed(8)));var decimalVars=(m[6]||'').replace(/\^1(?=[a-z]|$)/g,'');if(decimal==='1'&&decimalVars)return (sign<0?'-':'')+decimalVars;return (sign<0?'-':'')+decimal+decimalVars;}
  if(den>0&&Number.isSafeInteger(num)&&Number.isSafeInteger(den)){
   var g=function(a,b){while(b){var r=a%b;a=b;b=r;}return a||1;}(num,den);if(g!==1)return text; // Nicht gekuerzte Brueche werden bewusst nicht akzeptiert.
   num/=g;den/=g;
   var factors={},re=/([a-z])(?:\^(\d+))?/g,part;
   while((part=re.exec(m[6]))!==null){factors[part[1]]=(factors[part[1]]||0)+Number(part[2]||1);}
   var vars=Object.keys(factors).sort().map(function(key){return key+(factors[key]===1?'':'^'+factors[key]);}).join('');
   var coefficient='';
   if(vars){if(num!==den){coefficient=(num===1&&den===1?'':(den===1?String(num):num+'/'+den));}else{coefficient='';}}
   else{coefficient=den===1?String(num):num+'/'+den;}

 el('back').addEventListener('click',overview);el('check').addEventListener('click',check);el('answer').addEventListener('keydown',function(e){if(e.key==='Enter')check()});el('answer').addEventListener('input',function(){var v=this.value,p=this.selectionStart,w=v.replace(/[\u2010-\u2015\u2212\uFE63\uFF0D]/g,'-');if(v!==w){this.value=w;try{this.setSelectionRange(p,p)}catch(e){}}});el('hint').addEventListener('click',hint);el('ruleBtn').addEventListener('click',function(){var h=el('hintBox');h.textContent=l.rule.replace(/\n/g,' ');h.className='hint show'});el('answer').focus()}
function hint(){var t=levels[current].tasks[taskIndex],h=el('hintBox');if(hintIndex>=t.hint.length)hintIndex=t.hint.length-1;h.textContent=t.hint[hintIndex];h.className='hint show';hintIndex++}
function check(){var t=levels[current].tasks[taskIndex],v=norm(el('answer').value),f=el('feedback');if(!v){f.textContent='Bitte gib zuerst eine Antwort ein.';f.className='feedback show bad';return}tries++;if(arr(t.ans).map(norm).indexOf(v)>=0){var earned=Math.max(0,4-tries);points+=earned;areaPoints[levels[current].area]+=earned;f.textContent='Richtig! Du erhältst '+earned+' Punkte. '+t.why;f.className='feedback show good';update();el('answer').disabled=true;el('check').disabled=true;var n=document.createElement('button');n.className='action';n.textContent=taskIndex<levels[current].tasks.length-1?'Nächste Aufgabe':'Lernschritt abschliessen';n.addEventListener('click',next);el('app').querySelector('.buttons').appendChild(n)}else{penalties+=1;areaPenalties[levels[current].area]+=1;update();f.textContent=tries===1?'Noch nicht richtig. Prüfe zuerst die Koeffizienten und Vorzeichen.':tries===2?'Nutze einen Hinweis und kontrolliere die Potenzregel.':'Versuche es noch einmal oder lasse dir nach drei Versuchen die Erklärung zeigen.';f.className='feedback show bad';if(tries>=3&&!el('showSolution')){var b=document.createElement('button');b.id='showSolution';b.className='action secondary';b.textContent='Erklärung anzeigen';b.addEventListener('click',function(){f.textContent='Lösung: '+t.why;f.className='feedback show';el('answer').disabled=true;el('check').disabled=true;var n=document.createElement('button');n.className='action';n.textContent=taskIndex<levels[current].tasks.length-1?'Nächste Aufgabe':'Lernschritt abschliessen';n.addEventListener('click',next);el('app').querySelector('.buttons').appendChild(n)});el('app').querySelector('.buttons').appendChild(b)}}}
function next(){if(taskIndex<levels[current].tasks.length-1){taskIndex++;tries=0;hintIndex=0;lesson();return}completed[current]=true;if(current<levels.length-1){current++;taskIndex=0;tries=0;hintIndex=0;overview();return}overview()}
